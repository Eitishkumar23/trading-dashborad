# Production deployment pipeline
name: Build and Deploy

on: 
  push:
    branches:
      - main
env:
  ECR_REGISTRY:  752388616527.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci
        working-directory: ./server

      - name: Testing the code
        run: npm test
        working-directory: ./server

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Building Backend image
        run: docker build -t ${{ env.ECR_REGISTRY }}/trading-platform-backend:${{ env.IMAGE_TAG }} ./server
        
      - name: Pushing Image to ECR 
        run: docker push ${{ env.ECR_REGISTRY }}/trading-platform-backend:${{ env.IMAGE_TAG }}


  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Frontend code checkout
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend image
        run: docker build --no-cache --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" -t ${{ env.ECR_REGISTRY }}/trading-platform-frontend:${{ env.IMAGE_TAG }} -f Dockerfile.frontend .

      - name: Push Frontend image to ECR
        run: docker push ${{ env.ECR_REGISTRY }}/trading-platform-frontend:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
             export AWS_REGION="${{ secrets.AWS_REGION }}"
             export ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
             export IMAGE_TAG="${{ env.IMAGE_TAG }}"
             aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
             docker compose pull
             docker compose up -d --force-recreate --remove-orphans
             sleep 15
             curl --fail --retry 3 --retry-delay 5 http://localhost
             echo "Health check passed - Deployment success"
