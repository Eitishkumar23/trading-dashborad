name: Build and Deploy

on: 
  push:
    branches:
      - main
env:
  BACKEND_IMAGE: eitishkumar23/trading-platform-backend-image:latest
  FRONTEND_IMAGE: eitishkumar23/trading-platform-frontend-image:latest

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci
        working-directory: ./server

      - name: Testing the code
        run: npm test
        working-directory: ./server

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Building Backend image
        run: docker build -t ${{ env.BACKEND_IMAGE }} ./server
        
      - name: Pushing Image to Dockerhub
        run: docker push ${{ env.BACKEND_IMAGE }}


  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Frontend code checkout
        uses: actions/checkout@v4
      
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend image
        run: docker build --no-cache --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" -t ${{ env.FRONTEND_IMAGE }} -f Dockerfile.frontend .

      - name: Push Frontend image to Dockerhub
        run: docker push ${{ env.FRONTEND_IMAGE }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
             echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
             docker compose pull
             docker compose up -d
