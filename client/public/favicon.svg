<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Primary blue→cyan gradient for the globe -->
    <linearGradient id="globe" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2563EB"/>
      <stop offset="50%"  stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Lighter cyan fill for meridian arcs -->
    <linearGradient id="arc" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Subtle inner glow -->
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%"   stop-color="#BAE6FD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <!-- Dark background fill -->
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Globe circle — outer ring -->
  <circle cx="16" cy="16" r="10.5" stroke="url(#globe)" stroke-width="1.6" fill="none"/>

  <!-- Inner glow overlay -->
  <circle cx="16" cy="16" r="10.5" fill="url(#glow)"/>

  <!-- Horizontal equator line -->
  <line x1="5.5" y1="16" x2="26.5" y2="16" stroke="url(#arc)" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Vertical prime meridian -->
  <line x1="16" y1="5.5" x2="16" y2="26.5" stroke="url(#arc)" stroke-width="1.1" stroke-linecap="round"/>

  <!-- Upper latitude arc -->
  <path d="M 6.8 11.2 Q 16 8.4 25.2 11.2" stroke="url(#arc)" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Lower latitude arc -->
  <path d="M 6.8 20.8 Q 16 23.6 25.2 20.8" stroke="url(#arc)" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Left longitude arc -->
  <path d="M 16 5.5 Q 10.5 16 16 26.5" stroke="url(#arc)" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Right longitude arc -->
  <path d="M 16 5.5 Q 21.5 16 16 26.5" stroke="url(#arc)" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- Web3 network nodes — 4 accent dots on the intersections -->
  <circle cx="16" cy="5.5"  r="1.4" fill="#38BDF8"/>
  <circle cx="26.5" cy="16" r="1.4" fill="#0EA5E9"/>
  <circle cx="16" cy="26.5" r="1.4" fill="#38BDF8"/>
  <circle cx="5.5"  cy="16" r="1.4" fill="#0EA5E9"/>

  <!-- Center node — represents unified Web2+Web3 hub -->
  <circle cx="16" cy="16" r="2.2" fill="url(#globe)"/>
  <circle cx="16" cy="16" r="1.1" fill="#BAE6FD"/>
</svg>
